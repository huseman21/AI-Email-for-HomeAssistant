name: AI Email
version: "1.5.22"
slug: ai_email
description: Locally classify unread IMAP email with a configurable LLM and publish Home Assistant events.
startup: services
boot: auto
init: false
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:email-check-outline
panel_title: AI Email
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
options:
  log_level: info
  imap_host: ""
  imap_port: 143
  imap_security: starttls
  imap_timeout: 30
  imap_verify_ssl: false
  imap_username: ""
  imap_password: ""
  imap_mailbox: INBOX
  smtp_host: ""
  smtp_port: 25
  smtp_security: none
  smtp_use_tls: false
  smtp_username: ""
  smtp_from: ""
  smtp_password: ""
  homeassistant_api_token: ""
  viewer_port: 8099
  viewer_base_url: http://homeassistant.local:8099
  llm_provider: ollama
  llm_base_url: ""
  llm_model: llama3.2
  llm_api_key: ""
  homeassistant_conversation_agent: ""
  ollama_url: ""
  ollama_model: ""
  classification_criteria: >-
    Classify as important when the email is a direct personal message from a
    person, even if it is casual, social, or an invitation. Also classify as
    important when it involves action required, finances, bank accounts, credit
    cards, statements, bills, payments, fraud, security alerts, health, work,
    account access, or personal correspondence. Financial and security emails
    must be classified as important even if they are automated notifications.
    Classify as excluded only when the email is clearly a newsletter,
    advertisement, marketing message, promotion, spam, or unsolicited bulk
    email. Never classify a direct one-to-one email from a person as excluded
    merely because it is short or casual.
  poll_interval: 60
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  imap_host: str
  imap_port: port
  imap_security: list(ssl|starttls|none)
  imap_timeout: int(5,120)
  imap_verify_ssl: bool
  imap_username: str
  imap_password: password
  imap_mailbox: str
  smtp_host: str
  smtp_port: port
  smtp_security: list(ssl|starttls|none)
  smtp_use_tls: bool
  smtp_username: str
  smtp_from: str
  smtp_password: password
  homeassistant_api_token: password
  viewer_port: int(1024,65535)
  viewer_base_url: url
  llm_provider: list(ollama|openai_compatible|home_assistant)
  llm_base_url: str
  llm_model: str
  llm_api_key: password
  homeassistant_conversation_agent: str
  ollama_url: str
  ollama_model: str
  classification_criteria: str
  poll_interval: int(15,3600)
ports:
  8099/tcp: 8099
map:
  - config:rw
  - ssl:ro
